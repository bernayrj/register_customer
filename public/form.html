<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Fitelven</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
    <div class="logo">
         <img src="./imagen/logo_access.png" alt="logo_access">
    </div>
    <h1>Regístrate</h1>
        <form id="registroForm">
        <label>Nombre y apellido*</label>
        <input type="text" name="nombre" inputmode="latin" pattern="[A-Za-zñÑáéíóúüÁÉÍÓÚÜ ]+" title="solo letras" required>
        <label>Número de teléfono*</label>
        <input type="tel" name="telefono" pattern="[0-9]{11}" title="11 digitos requeridos" required>
        <label>Correo electrónico*</label>
        <input type="email" name="correo" required>
        <button type="submit">Aceptar</button>
        <div id="message"></div>
    </form>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const form = e.target;
            const data = {
                nombre: form.nombre.value,
                telefono: form.telefono.value,
                correo: form.correo.value
            };

            try {
                const response = await fetch('/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                const messageDiv = document.getElementById('message');
                if (result.success) {
                    messageDiv.textContent = 'Registro exitoso.';
                    messageDiv.style.color = 'green';
                    form.reset();
                } else {
                    messageDiv.textContent = 'Error al registrar: ' + result.error;
                    messageDiv.style.color = 'red';
                }
            } catch (error) {
                document.getElementById('message').textContent = 'Error de conexión.';
                document.getElementById('message').style.color = 'red';
            }
        });
    </script>

</body>
</html>
